[package]
name = "aurex"
version = "0.1.0"
edition = "2021"
description = "Aurex — lecteur Twitch + YouTube audiophile (sortie exclusive bit-perfect)"
rust-version = "1.86"

[lib]
name = "aurex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["libmpv"]
# Sans libmpv : l'app compile et tourne (UI, audio natif YouTube) mais n'affiche pas de vidéo.
# Utile en CI et pour développer sans installer libmpv.
libmpv = ["dep:libmpv2"]

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
raw-window-handle = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
audio-engine = { path = "../crates/audio-engine" }
yt-native = { path = "../crates/yt-native" }
hls-guard = { path = "../crates/hls-guard" }
libmpv2 = { version = "4", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["all"] }
objc2-app-kit = { version = "0.2", features = ["all"] }
