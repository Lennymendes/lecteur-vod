name: Build (installeurs de test)
# Construit l'application COMPLÈTE (avec libmpv) pour macOS Apple Silicon et Windows x64.
# Téléchargez les artefacts dans l'onglet Actions → run → Artifacts.
on:
  push: { branches: [main] }
  workflow_dispatch:

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: libmpv + ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install mpv ffmpeg molten-vk
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Outils MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: libmpv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          New-Item -ItemType Directory -Force libmpv | Out-Null
          gh release download -R shinchiro/mpv-winbuild-cmake -p "mpv-dev-x86_64-2*.7z" -D libmpv --clobber
          Get-ChildItem libmpv
          7z x (Get-ChildItem libmpv\mpv-dev-x86_64-*.7z | Select-Object -First 1).FullName -olibmpv -y | Out-Null
          Get-ChildItem libmpv -Recurse | Select-Object -First 40 FullName
          # Pas de .def fourni : on le génère à partir des exports de la DLL, puis on crée mpv.lib.
          $names = dumpbin /exports libmpv\libmpv-2.dll | ForEach-Object { if ($_ -match '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]{8}\s+(\S+)') { $Matches[1] } }
          ("LIBRARY libmpv-2.dll", "EXPORTS") + $names | Set-Content libmpv\mpv.def -Encoding ascii
          "exports : $($names.Count)"
          lib /def:libmpv\mpv.def /name:libmpv-2.dll /out:libmpv\mpv.lib /machine:x64
          Copy-Item libmpv\libmpv-2.dll src-tauri\binaries\libmpv-2.dll
          "LIB=$env:LIB;$PWD\libmpv" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - run: npm install
      - run: npm --prefix ui install
      - name: Sidecars (yt-dlp, ffmpeg)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then pwsh scripts/fetch-sidecars.ps1; else scripts/fetch-sidecars.sh ${{ matrix.target }}; fi
      - run: npx tauri build --target ${{ matrix.target }}
      - name: Embarquer libmpv + ffmpeg dans l'app (macOS, sans Homebrew côté utilisateur)
        if: runner.os == 'macOS'
        run: |
          brew install dylibbundler
          APP="target/${{ matrix.target }}/release/bundle/macos/Aurex.app"
          mkdir -p "$APP/Contents/Frameworks"
          dylibbundler -od -b -cd -x "$APP/Contents/MacOS/aurex" -x "$APP/Contents/MacOS/ffmpeg" \
            -d "$APP/Contents/Frameworks" -p "@executable_path/../Frameworks/"
          # dylibbundler duplique des LC_RPATH (dans l'exe ET dans les dylibs) : dyld refuse alors de charger.
          python3 scripts/fix-macos-rpaths.py "$APP"
          # MoltenVK (Vulkan→Metal) : mpv 0.4x sur macOS n'a que des contextes Vulkan ; sans pilote → pas d'image.
          cp -L "$(brew --prefix molten-vk)/lib/libMoltenVK.dylib" "$APP/Contents/Frameworks/libMoltenVK.dylib"
          mkdir -p "$APP/Contents/Resources/vulkan"
          cat > "$APP/Contents/Resources/vulkan/MoltenVK_icd.json" <<'JSON'
          {"file_format_version":"1.0.0","ICD":{"library_path":"../../Frameworks/libMoltenVK.dylib","api_version":"1.2.0"}}
          JSON
          ls -l "$APP/Contents/Frameworks" | grep -iE "vulkan|MoltenVK"
          # Re-signature ad hoc (install_name_tool invalide les signatures), dylibs d'abord.
          find "$APP/Contents/Frameworks" -name '*.dylib' -type f -exec codesign --force --sign - {} \;
          codesign --force --sign - "$APP/Contents/MacOS/ffmpeg"
          codesign --force --deep --sign - "$APP"
          # Vrai test dyld : lance l'app 8 s (pas de `timeout` sous macOS) et cherche une erreur de chargement.
          "$APP/Contents/MacOS/aurex" > /tmp/aurex-launch.log 2>&1 & PID=$!
          sleep 8; kill $PID 2>/dev/null || true
          echo "--- sortie du lancement ---"; head -30 /tmp/aurex-launch.log
          if grep -qE "Library not loaded|duplicate LC_RPATH|dyld\[" /tmp/aurex-launch.log; then echo "ERREUR dyld"; exit 1; fi
          "$APP/Contents/MacOS/ffmpeg" -version | head -1
          ditto -c -k --keepParent "$APP" Aurex-macos-arm64.zip
          otool -L "$APP/Contents/MacOS/aurex" | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: aurex-${{ matrix.target }}
          path: |
            Aurex-macos-arm64.zip
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: error
