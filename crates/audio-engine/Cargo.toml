[package]
name = "audio-engine"
version = "0.1.0"
edition = "2021"
description = "Sortie audio exclusive (hog mode CoreAudio / WASAPI exclusive) avec bascule automatique de fréquence."

[dependencies]
audio-core = { path = "../audio-core" }
libloading = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-sys = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
# API écrite pour la série 0.15 ; si vous montez de version, adaptez backend/wasapi_excl.rs.
wasapi = "0.15"
