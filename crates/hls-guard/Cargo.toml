[package]
name = "hls-guard"
version = "0.1.0"
edition = "2021"
description = "Résolution du M3U8 Twitch (GQL + usher), contournement SSAI, proxy HLS local pour libmpv."

[dependencies]
hls-playlist = { path = "../hls-playlist" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
rand = "0.8"
log = "0.4"
